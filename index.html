<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nysse Reitit</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
    h1 { font-size: 18px; color: #ff9900; margin-top: 0; }
    label { display: block; margin-top: 8px; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; }
    button { padding: 10px; margin-top: 10px; background: #ff9900; border: none; font-weight: bold; color: #000; cursor: pointer; }
    .btn-main { width: 100%; font-size: 16px; margin-bottom: 10px; }
    .time-nav { display: flex; gap: 10px; margin-top: 10px; }
    .time-nav button { flex: 1; background: #333; color: #fff; border: 1px solid #555; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
    .itinerary { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin-top: 15px; }
    .leg { border-bottom: 1px solid #333; padding: 8px 0; }
    .leg:last-child { border-bottom: none; }
    .mode { font-weight: bold; color: #00ff00; }
    .walk { color: #aaaaaa; }
    a.gmap-link { color: #4da6ff; text-decoration: underline; font-size: 13px; margin-left: 4px; }
  </style>
</head>
<body>

  <h1>Nysse Reittihaku</h1>

  <label for="from">Mistä (esim. Keskustori):</label>
  <input type="text" id="from" value="Keskustori">

  <label for="to">Mihin (esim. Hervanta):</label>
  <input type="text" id="to" value="Hervanta">

  <button class="btn-main" onclick="uusiHaku()">Etsi reitti</button>

  <div id="timeNav" class="time-nav" style="display: none;">
    <button onclick="muutaAikaa(-30)">⬅ Lähde aiemmin</button>
    <button onclick="muutaAikaa(30)">Lähde myöhemmin ➔</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <script>
    const API_KEY = "d3900a5cacf542eb97f35733a6ade244"; // Aseta oma Digitransit API-avaimesi tähän

    let nykyinenAika = new Date();
    let muistissaFrom = null;
    let muistissaTo = null;

    async function geocode(paikka) {
      const url = `https://api.digitransit.fi/geocoding/v1/search?text=${encodeURIComponent(paikka)}&size=1&boundary.rect.min_lat=61.2&boundary.rect.max_lat=61.7&boundary.rect.min_lon=23.3&boundary.rect.max_lon=24.2`;
      const res = await fetch(url, { 
        headers: { 'digitransit-subscription-key': API_KEY } 
      });
      const data = await res.json();

      if (data.features && data.features.length > 0) {
        const coords = data.features[0].geometry.coordinates;
        return { 
          lon: coords[0], 
          lat: coords[1], 
          name: data.features[0].properties.name 
        };
      }
      return null;
    }

    function uusiHaku() {
      nykyinenAika = new Date(); // Nollataan hakuhetki nykyhetkeen
      muistissaFrom = null;
      muistissaTo = null;
      haeReitti();
    }

    function muutaAikaa(minuutit) {
      nykyinenAika = new Date(nykyinenAika.getTime() + minuutit * 60000);
      haeReitti();
    }

    async function haeReitti() {
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');
      const timeNav = document.getElementById('timeNav');
      const fromText = document.getElementById('from').value;
      const toText = document.getElementById('to').value;

      statusDiv.innerText = "Ladataan...";
      resultsDiv.innerHTML = "";

      try {
        // Haetaan koordinaatit vain jos niitä ei ole vielä muistissa
        if (!muistissaFrom || !muistissaTo) {
          statusDiv.innerText = "Etsitään paikkojen koordinaatteja...";
          muistissaFrom = await geocode(fromText);
          muistissaTo = await geocode(toText);
        }

        if (!muistissaFrom || !muistissaTo) {
          statusDiv.innerText = "Paikkaa ei löytynyt! Tarkista hakusanat.";
          timeNav.style.display = "none";
          return;
        }

        // Muotoillaan aika Digitransit GraphQLin vaatimaan muotoon YYYY-MM-DD ja HH:MM:SS
        const isoPvm = nykyinenAika.toISOString().split('T')[0];
        const aikaKlo = nykyinenAika.toTimeString().split(' ')[0];

        statusDiv.innerText = `Lasketaan reittiä (${aikaKlo}): ${muistissaFrom.name} -> ${muistissaTo.name}...`;

        const query = `{
          plan(
            from: {lat: ${muistissaFrom.lat}, lon: ${muistissaFrom.lon}}
            to: {lat: ${muistissaTo.lat}, lon: ${muistissaTo.lon}}
            date: "${isoPvm}"
            time: "${aikaKlo}"
            numItineraries: 3
          ) {
            itineraries {
              startTime
              endTime
              legs {
                mode
                startTime
                endTime
                from { 
                  name 
                  lat
                  lon
                }
                to { 
                  name 
                  lat
                  lon
                }
                route { shortName }
              }
            }
          }
        }`;

        const response = await fetch('https://api.digitransit.fi/routing/v2/waltti/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': API_KEY
          },
          body: JSON.stringify({ query })
        });

        const resData = await response.json();

        if (resData.errors && resData.errors.length > 0) {
          console.error("GraphQL Errors:", resData.errors);
          statusDiv.innerText = "API-virhe: " + resData.errors[0].message;
          return;
        }

        if (!resData.data || !resData.data.plan) {
          statusDiv.innerText = "Ei reittitietoja saatavilla.";
          return;
        }

        const itineraries = resData.data.plan.itineraries;
        statusDiv.innerText = "";
        
        if (!itineraries || itineraries.length === 0) {
          resultsDiv.innerHTML = "<p>Ei reittejä valitulle ajankohdalle.</p>";
          timeNav.style.display = "flex";
          return;
        }

        // Päivitetään hakuajan viite ensimmäisen löydetyn reitin lähtöaikaan
        nykyinenAika = new Date(itineraries[0].startTime);

        itineraries.forEach((it, index) => {
          const lahto = new Date(it.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          const perilla = new Date(it.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          
          let html = `<div class="itinerary"><h3>Reitti ${index + 1} (${lahto} - ${perilla})</h3>`;

          it.legs.forEach(leg => {
            const legStart = new Date(leg.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Luodaan Google Maps -linkit koordinaateille
            const fromMapUrl = `https://www.google.com/maps/search/?api=1&query=${leg.from.lat},${leg.from.lon}`;
            const toMapUrl = `https://www.google.com/maps/search/?api=1&query=${leg.to.lat},${leg.to.lon}`;

            const fromLink = `${leg.from.name} <a class="gmap-link" href="${fromMapUrl}" target="_blank">[Kartta]</a>`;
            const toLink = `${leg.to.name} <a class="gmap-link" href="${toMapUrl}" target="_blank">[Kartta]</a>`;

            if (leg.mode === 'WALK') {
              html += `<div class="leg walk">🚶 ${legStart} Kävele: ${fromLink} ➔ ${toLink}</div>`;
            } else {
              const busNo = (leg.route && leg.route.shortName) ? leg.route.shortName : '';
              html += `<div class="leg"><span class="mode">🚌 Linja ${busNo}</span> (${legStart}): ${fromLink} ➔ ${toLink}</div>`;
            }
          });

          html += `</div>`;
          resultsDiv.innerHTML += html;
        });

        // Näytetään aiemmin/myöhemmin-napit tulosten tultua
        timeNav.style.display = "flex";

      } catch (err) {
        console.error("Verkko- tai koodivirhe:", err);
        statusDiv.innerText = "Virhe haettaessa tietoja: " + err.message;
      }
    }
  </script>
</body>
</html>
