<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nysse Reitit</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
    h1 { font-size: 18px; color: #ff9900; margin-top: 0; }
    label { display: block; margin-top: 8px; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; }
    button { padding: 10px; margin-top: 10px; background: #ff9900; border: none; font-weight: bold; color: #000; cursor: pointer; }
    .btn-main { width: 100%; font-size: 16px; margin-bottom: 10px; }
    .time-nav { margin-top: 10px; }
    .time-nav button { width: 48%; background: #333; color: #fff; border: 1px solid #555; }
    .status { margin-top: 10px; color: #aaa; font-size: 14px; }
    .itinerary { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin-top: 15px; }
    .leg { border-bottom: 1px solid #333; padding: 8px 0; }
    .leg:last-child { border-bottom: none; }
    .mode { font-weight: bold; color: #00ff00; }
    .walk { color: #aaaaaa; }
    a.gmap-link { color: #4da6ff; text-decoration: underline; font-size: 13px; margin-left: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Nysse Reittihaku</h1>

  <label for="from">Mistä (esim. Keskustori):</label>
  <input type="text" id="from" value="Keskustori">

  <label for="to">Mihin (esim. Hervanta):</label>
  <input type="text" id="to" value="Hervanta">

  <button class="btn-main" onclick="uusiHaku()">Etsi reitti</button>

  <div id="timeNav" class="time-nav" style="display: none;">
    <button onclick="muutaAikaa(-30)">⬅ Aiemmin</button>
    <button onclick="muutaAikaa(30)">Myöhemmin ➔</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <script>
    var API_KEY = "d3900a5cacf542eb97f35733a6ade244"; // Aseta oma API-avain tähän

    var nykyinenAika = new Date();
    var muistissaFrom = null;
    var muistissaTo = null;

    // Ohjaa Google Mapsiin suoraan MetroSurfin sisällä ilman IE-avausta
    function goMap(lat, lon) {
      var mapUrl = "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon;
      window.location.href = mapUrl;
    }

    function uusiHaku() {
      nykyinenAika = new Date();
      muistissaFrom = null;
      muistissaTo = null;
      prosessiHaku();
    }

    function muutaAikaa(minuutit) {
      nykyinenAika = new Date(nykyinenAika.getTime() + minuutit * 60000);
      prosessiHaku();
    }

    function makeRequest(url, method, headers, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      for (var key in headers) {
        if (headers.hasOwnProperty(key)) {
          xhr.setRequestHeader(key, headers[key]);
        }
      }
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              callback(null, data);
            } catch (e) {
              callback("JSON virhe: " + e.message);
            }
          } else {
            callback("HTTP Virhe: " + xhr.status);
          }
        }
      };
      xhr.send(body);
    }

    function geocode(paikka, callback) {
      var url = "https://api.digitransit.fi/geocoding/v1/search?text=" + encodeURIComponent(paikka) + "&size=1&boundary.rect.min_lat=61.2&boundary.rect.max_lat=61.7&boundary.rect.min_lon=23.3&boundary.rect.max_lon=24.2";
      var headers = { 'digitransit-subscription-key': API_KEY };
      
      makeRequest(url, "GET", headers, null, function(err, data) {
        if (err || !data || !data.features || data.features.length === 0) {
          callback(null);
        } else {
          var coords = data.features[0].geometry.coordinates;
          callback({
            lon: coords[0],
            lat: coords[1],
            name: data.features[0].properties.name
          });
        }
      });
    }

    function prosessiHaku() {
      var statusDiv = document.getElementById('status');
      var resultsDiv = document.getElementById('results');
      var timeNav = document.getElementById('timeNav');
      var fromText = document.getElementById('from').value;
      var toText = document.getElementById('to').value;

      statusDiv.innerHTML = "Odotetaan koordinaatteja...";
      resultsDiv.innerHTML = "";

      if (!muistissaFrom || !muistissaTo) {
        geocode(fromText, function(resFrom) {
          if (!resFrom) {
            statusDiv.innerHTML = "Lähtöpaikkaa ei löytynyt.";
            return;
          }
          muistissaFrom = resFrom;

          geocode(toText, function(resTo) {
            if (!resTo) {
              statusDiv.innerHTML = "Määränpäätä ei löytynyt.";
              return;
            }
            muistissaTo = resTo;
            haeReittiAPI();
          });
        });
      } else {
        haeReittiAPI();
      }
    }

    function haeReittiAPI() {
      var statusDiv = document.getElementById('status');
      var resultsDiv = document.getElementById('results');
      var timeNav = document.getElementById('timeNav');

      var YYYY = nykyinenAika.getFullYear();
      var MM = ('0' + (nykyinenAika.getMonth() + 1)).slice(-2);
      var DD = ('0' + nykyinenAika.getDate()).slice(-2);
      var hh = ('0' + nykyinenAika.getHours()).slice(-2);
      var mm = ('0' + nykyinenAika.getMinutes()).slice(-2);
      var ss = ('0' + nykyinenAika.getSeconds()).slice(-2);

      var isoPvm = YYYY + "-" + MM + "-" + DD;
      var aikaKlo = hh + ":" + mm + ":" + ss;

      statusDiv.innerHTML = "Haetaan reittejä (" + hh + ":" + mm + ")...";

      var query = '{ plan(from: {lat: ' + muistissaFrom.lat + ', lon: ' + muistissaFrom.lon + '} to: {lat: ' + muistissaTo.lat + ', lon: ' + muistissaTo.lon + '} date: "' + isoPvm + '" time: "' + aikaKlo + '" numItineraries: 3) { itineraries { startTime endTime legs { mode startTime endTime from { name lat lon } to { name lat lon } route { shortName } } } } }';

      var headers = {
        'Content-Type': 'application/json',
        'digitransit-subscription-key': API_KEY
      };

      makeRequest('https://api.digitransit.fi/routing/v2/waltti/gtfs/v1', 'POST', headers, JSON.stringify({ query: query }), function(err, resData) {
        if (err) {
          statusDiv.innerHTML = "Virhe: " + err;
          return;
        }

        if (resData.errors && resData.errors.length > 0) {
          statusDiv.innerHTML = "API-virhe: " + resData.errors[0].message;
          return;
        }

        if (!resData.data || !resData.data.plan) {
          statusDiv.innerHTML = "Ei reittitietoja saatavilla.";
          return;
        }

        var itineraries = resData.data.plan.itineraries;
        statusDiv.innerHTML = "";

        if (!itineraries || itineraries.length === 0) {
          resultsDiv.innerHTML = "<p>Ei reittejä valitulle ajankohdalle.</p>";
          timeNav.style.display = "block";
          return;
        }

        var htmlBuffer = "";

        for (var i = 0; i < itineraries.length; i++) {
          var it = itineraries[i];
          var dStart = new Date(it.startTime);
          var dEnd = new Date(it.endTime);

          var lahto = ('0' + dStart.getHours()).slice(-2) + ":" + ('0' + dStart.getMinutes()).slice(-2);
          var perilla = ('0' + dEnd.getHours()).slice(-2) + ":" + ('0' + dEnd.getMinutes()).slice(-2);

          htmlBuffer += '<div class="itinerary"><h3>Reitti ' + (i + 1) + ' (' + lahto + ' - ' + perilla + ')</h3>';

          for (var j = 0; j < it.legs.length; j++) {
            var leg = it.legs[j];
            var dLegStart = new Date(leg.startTime);
            var legStart = ('0' + dLegStart.getHours()).slice(-2) + ":" + ('0' + dLegStart.getMinutes()).slice(-2);

            // Generoidaan JS-funktiokutsut redirectiä varten
            var fromLink = leg.from.name + ' <a class="gmap-link" onclick="goMap(' + leg.from.lat + ',' + leg.from.lon + ')">[Kartta]</a>';
            var toLink = leg.to.name + ' <a class="gmap-link" onclick="goMap(' + leg.to.lat + ',' + leg.to.lon + ')">[Kartta]</a>';

            if (leg.mode === 'WALK') {
              htmlBuffer += '<div class="leg walk">🚶 ' + legStart + ' Kävele: ' + fromLink + ' ➔ ' + toLink + '</div>';
            } else {
              var busNo = (leg.route && leg.route.shortName) ? leg.route.shortName : '';
              htmlBuffer += '<div class="leg"><span class="mode">🚌 Linja ' + busNo + '</span> (' + legStart + '): ' + fromLink + ' ➔ ' + toLink + '</div>';
            }
          }

          htmlBuffer += '</div>';
        }

        resultsDiv.innerHTML = htmlBuffer;
        timeNav.style.display = "block";
      });
    }
  </script>
</body>
</html>
